<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>每日要货助手</title>
<style>
:root{--bg:#f7f5f0;--paper:#fff;--ink:#302f29;--muted:#8c8980;--line:#eae6de;--green:#587b62;--green2:#eaf1e9;--amber:#b27a37;--amber2:#fbf1e2;--red:#b75d50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:88px}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:18px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}h1{font-size:23px;margin:0;font-weight:760}.sub{font-size:12px;color:var(--muted);margin-top:5px}
.topbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:#555;font-size:13px}
.tabs{display:flex;gap:5px;padding:4px;background:#eeebe4;border-radius:14px;margin-bottom:14px}.tab{flex:1;background:transparent;border:0;border-radius:11px;padding:10px 4px;color:#777;font-size:13px}.tab.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 8px #0000000c}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px #30250c08}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.cardhead strong{font-size:15px}.hint{font-size:11px;color:var(--muted)}
.datebox{display:flex;justify-content:space-between;align-items:center;gap:10px}.datebox .big{font-size:21px;font-weight:760}.datebox input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 8px;color:#555;width:145px}
.daynote{font-size:11px;color:var(--muted);margin-top:4px}
.catbar{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:12px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:12px;color:#666}.cat.active{background:var(--green);color:#fff;border-color:var(--green)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;margin-bottom:9px}
.product{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #f1eee9}.product:first-child{border-top:0}.pick{width:21px;height:21px;accent-color:var(--green);flex-shrink:0}.pname{font-size:14px;font-weight:650}.pmeta{font-size:11px;color:var(--muted);margin-top:4px}.pinfo{flex:1;min-width:0}.tag{font-size:10px;padding:3px 7px;border-radius:10px;background:#f1efe9;color:#777;white-space:nowrap}.tag.common{background:var(--green2);color:var(--green)}.tag.rare{background:var(--amber2);color:var(--amber)}
.qtybox{display:flex;align-items:center;gap:5px}.qtybox input{width:62px;text-align:center;border:1px solid #dcd8cf;border-radius:9px;padding:7px 3px;font-size:13px}.unit{font-size:11px;color:var(--muted)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:650}.primary{background:var(--green);color:#fff}.light{background:var(--green2);color:var(--green)}.neutral{background:#f1efe9;color:#555}.outline{background:#fff;border:1px solid var(--line);color:#555}.danger{background:#f9ece9;color:var(--red)}
.summary{background:#f4f2ec;border-radius:13px;padding:12px;margin-top:12px}.summarytop{display:flex;justify-content:space-between;align-items:center}.summarytop b{font-size:14px}.summarytop span{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:26px 8px;color:var(--muted);font-size:12px;line-height:1.8}
.itemactions{display:flex;gap:6px}.mini{border:0;border-radius:9px;padding:7px 9px;font-size:11px;background:#f1efe9;color:#555}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:4}.bottomin{width:min(760px,100%);display:flex;justify-content:space-around}.nav{background:none;border:0;color:#89867e;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px 20px}.nav b{font-size:19px;font-weight:500}.nav.active{color:var(--green);font-weight:700}
.panelhidden{display:none!important}.toolbar{display:flex;gap:8px;align-items:center}.toolbar select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;min-width:0;flex:1}
.modalback{display:none;position:fixed;inset:0;background:#17140f66;z-index:10;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{width:min(760px,100%);background:#fff;border-radius:21px 21px 0 0;padding:19px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.modal h3{margin:0 0 14px}.field{display:block;margin:11px 0}.field span{display:block;font-size:12px;color:#777;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.modalfoot{display:flex;gap:8px;margin-top:16px}.modalfoot button{flex:1}
.toast{display:none;position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:20;background:#302f29;color:#fff;border-radius:22px;padding:10px 15px;font-size:12px;white-space:nowrap}
.historyrow{padding:12px 0;border-top:1px solid #f0ede8;display:flex;justify-content:space-between;align-items:center;gap:8px}.historyrow:first-child{border-top:0}
@media(min-width:600px){.modalback{align-items:center}.modal{max-width:500px;border-radius:20px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>每日要货助手</h1><div class="sub">明天要做什么，今天安排好 🥐</div></div><div style="display:flex;gap:7px"><button class="topbtn" id="backupBtn">数据备份</button><button class="topbtn" id="addProductBtn">＋ 商品</button></div></header>
<div class="tabs">
 <button class="tab active" data-page="order">每日要货</button>
 <button class="tab" data-page="catalog">商品管理</button>
 <button class="tab" data-page="history">历史记录</button>
</div>

<section id="orderPage">
 <div class="card">
  <div class="datebox">
   <div><div class="hint">正在填写的要货日期</div><div class="big" id="dateTitle">—</div><div class="daynote" id="dateNote">为后厨安排次日制作</div></div>
   <input type="date" id="orderDate">
  </div>
  <div class="rowbtns">
   <button class="btn outline" id="prevDay">‹ 前一天</button>
   <button class="btn outline" id="nextDay">后一天 ›</button>
   <button class="btn neutral" id="todayBtn">回到明天</button>
  </div>
 </div>
 <div class="card">
  <div class="cardhead"><strong>选择今天需要的商品</strong><span class="hint" id="saveState">自动保存中</span></div>
  <div class="catbar" id="categoryTabs">
   <button class="cat active" data-cat="全部">全部</button>
   <button class="cat" data-cat="面包">🥐 面包</button>
   <button class="cat" data-cat="甜品">🍰 甜品</button>
   <button class="cat" data-cat="点心">🍪 点心</button>
   <button class="cat" data-cat="奶制品">🥛 奶制品</button>
   <button class="cat" data-cat="其他">其他</button>
  </div>
  <input class="search" id="orderSearch" placeholder="搜索商品名称…">
  <div class="hint" style="margin-bottom:5px">点选商品加入要货单；已选商品会显示数量框，再点一次可取消。</div>
  <div id="productPicker"></div>
  <div class="summary">
   <div class="summarytop"><b>本次要货单</b><span id="summaryCount">0 种商品</span></div>
   <div class="hint" id="summaryText" style="margin-top:7px">还没有选择商品</div>
   <div class="rowbtns">
    <button class="btn primary" id="copyOrder">复制要货单</button>
    <button class="btn neutral" id="clearOrder">清空今天</button>
   </div>
  </div>
 </div>
</section>

<section id="catalogPage" class="panelhidden">
 <div class="card">
  <div class="cardhead"><strong>商品库</strong><div class="rowbtns" style="margin:0"><button class="btn light" id="manageCategories">＋ 新增种类</button><button class="btn primary" id="newProduct">＋ 新增商品</button></div></div>
  <div class="hint" style="line-height:1.7;margin-bottom:12px">所有商品统一放在这里，按分类显示。常用商品排前面；不常用商品仍然可以在每日要货时点选。</div>
  <input class="search" id="catalogSearch" placeholder="搜索商品…">
  <div class="toolbar"><select id="catalogCategory"><option value="全部">全部分类</option></select><select id="catalogStatus"><option value="全部">全部属性</option><option value="common">常用</option><option value="rare">不常用</option></select></div>
  <div id="catalogList" style="margin-top:8px"></div>
 </div>
</section>

<section id="historyPage" class="panelhidden">
 <div class="card">
  <div class="cardhead"><strong>历史要货记录</strong><span class="hint">每一天独立保存</span></div>
  <div class="hint" style="line-height:1.7;margin-bottom:10px">点击某一天可以查看或继续修改。修改历史日期不会影响其他日期。</div>
  <div id="historyList"></div>
 </div>
</section>
</div>
<nav class="bottom"><div class="bottomin">
 <button class="nav active" data-page="order"><b>☷</b>每日要货</button>
 <button class="nav" data-page="catalog"><b>▦</b>商品管理</button>
 <button class="nav" data-page="history"><b>◷</b>历史记录</button>
</div></nav>
<div class="modalback" id="modalBack"><div class="modal">
 <h3 id="modalTitle">新增商品</h3>
 <form id="productForm">
  <input type="hidden" id="productId">
  <label class="field"><span>商品名称 *</span><input id="productName" required maxlength="60" placeholder="例如：原味吐司"></label>
  <label class="field"><span>所属分类</span><select id="productCategory"></select></label>
  <label class="field"><span>默认订货数量</span><input id="productQty" type="number" min="0" step="0.1" value="1"></label>
  <label class="field"><span>单位（可选）</span><input id="productUnit" maxlength="10" placeholder="个 / 袋 / 瓶"></label>
  <label class="field"><span>商品属性</span><select id="productStatus"><option value="common">常用</option><option value="rare">不常用</option></select></label>
  <label class="field"><span>最近一次上货日期（可选）</span><input id="productStocked" type="date"></label>
  <div class="modalfoot"><button type="button" class="btn neutral" id="cancelModal">取消</button><button class="btn primary" type="submit">保存</button></div>
 </form>
</div></div>
<input type="file" id="restoreFile" accept=".json,application/json" style="display:none"><div class="toast" id="toast"></div>
<script>
const PRODUCT_KEY='dailyOrder_products_v2',ORDER_KEY='dailyOrder_orders_v2',CATEGORY_KEY='dailyOrder_categories_v1';
const DEFAULT_CATEGORIES=['面包','甜品','点心','奶制品','其他'];
let products=[],orders={},categories=[...DEFAULT_CATEGORIES],activeDate='',activeCategory='全部',page='order';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>new Date(s+'T12:00:00');
const shift=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){try{products=JSON.parse(localStorage.getItem(PRODUCT_KEY)||'[]');orders=JSON.parse(localStorage.getItem(ORDER_KEY)||'{}');let saved=JSON.parse(localStorage.getItem(CATEGORY_KEY)||'[]');categories=[...DEFAULT_CATEGORIES,...saved.filter(c=>!DEFAULT_CATEGORIES.includes(c))];products.forEach(p=>{if(p.category&&!categories.includes(p.category))categories.push(p.category)});saveCategories()}catch(e){products=[];orders={};categories=[...DEFAULT_CATEGORIES]}}
function saveCategories(){localStorage.setItem(CATEGORY_KEY,JSON.stringify(categories.filter(c=>!DEFAULT_CATEGORIES.includes(c))))}
function renderCategoryControls(){
 const tab=$('categoryTabs'),filter=$('catalogCategory'),select=$('productCategory');
 const keepFilter=filter.value||'全部',keepProduct=select.value||'面包';
 tab.innerHTML='<button class="cat" data-cat="全部">全部</button>'+categories.map(c=>`<button class="cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 filter.innerHTML='<option value="全部">全部分类</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
 select.innerHTML=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
 filter.value=categories.includes(keepFilter)?keepFilter:'全部';
 select.value=categories.includes(keepProduct)?keepProduct:categories[0];
 tab.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderOrder()});
}
function addCategory(){
 const name=prompt('请输入新种类名称：');
 if(name===null)return;
 const value=name.trim();
 if(!value){toast('种类名称不能为空');return}
 if(categories.some(c=>c.toLowerCase()===value.toLowerCase())){toast('这个种类已经存在');return}
 categories.push(value);saveCategories();renderCategoryControls();renderOrder();renderCatalog();toast('新种类已添加');
}
function saveProducts(){localStorage.setItem(PRODUCT_KEY,JSON.stringify(products))}
function saveOrders(){localStorage.setItem(ORDER_KEY,JSON.stringify(orders));$('saveState').textContent='已自动保存'}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1900)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayLabel(s){let d=parseDate(s),w=['日','一','二','三','四','五','六'][d.getDay()];return `${d.getMonth()+1}月${d.getDate()}日 · 星期${w}`}
function ensureOrder(date){if(orders[date])return;let previous=orders[shift(date,-1)];orders[date]=previous?JSON.parse(JSON.stringify(previous)):{};saveOrders()}
function currentOrder(){return orders[activeDate]||(orders[activeDate]={})}
function setDate(date){activeDate=date;$('orderDate').value=date;ensureOrder(date);renderOrder();renderHistory()}
function changePage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('orderPage').classList.toggle('panelhidden',p!=='order');$('catalogPage').classList.toggle('panelhidden',p!=='catalog');$('historyPage').classList.toggle('panelhidden',p!=='history');$('addProductBtn').style.display=p==='order'?'block':'none';if(p==='catalog')renderCatalog();if(p==='history')renderHistory()}
function renderOrder(){
 $('dateTitle').textContent=dayLabel(activeDate);$('dateNote').textContent='这份清单对应后厨在这一天制作的商品';
 $('categoryTabs').querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===activeCategory));
 const q=$('orderSearch').value.trim().toLowerCase(),o=currentOrder();
 const list=products.filter(p=>(activeCategory==='全部'||p.category===activeCategory)&&(!q||p.name.toLowerCase().includes(q))).sort((a,b)=>(a.status==='common'?0:1)-(b.status==='common'?0:1)||a.name.localeCompare(b.name,'zh-CN'));
 $('productPicker').innerHTML=list.length?list.map(p=>{let chosen=Object.prototype.hasOwnProperty.call(o,p.id),entry=o[p.id]||{};return `<div class="product"><input class="pick" type="checkbox" data-pick="${p.id}" ${chosen?'checked':''}><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.category)} · <span class="tag ${p.status}">${p.status==='common'?'常用':'不常用'}</span></div></div>${chosen?`<div class="qtybox"><input type="number" min="0" step="0.1" data-orderqty="${p.id}" value="${Number(entry.qty??p.qty??1)}"><span class="unit">${esc(entry.unit??p.unit??'')}</span></div>`:''}</div>`}).join(''):'<div class="empty">这个分类还没有商品。<br>可以先去「商品管理」添加。</div>';
 $('productPicker').querySelectorAll('[data-pick]').forEach(el=>el.onchange=()=>{let id=el.dataset.pick;if(el.checked){let p=products.find(x=>x.id===id);o[id]={qty:p?.qty??1,unit:p?.unit||''}}else delete o[id];saveOrders();renderOrder()});
 $('productPicker').querySelectorAll('[data-orderqty]').forEach(el=>el.onchange=()=>{o[el.dataset.orderqty].qty=Math.max(0,Number(el.value)||0);saveOrders();renderSummary()});
 renderSummary();
}
function renderSummary(){let o=currentOrder(),ids=Object.keys(o);$('summaryCount').textContent=ids.length+' 种商品';let lines=ids.map(id=>{let p=products.find(x=>x.id===id);return p?`${p.name} ${o[id].qty}${o[id].unit||''}`:''}).filter(Boolean);$('summaryText').textContent=lines.length?lines.join('、'):'还没有选择商品';}
function renderCatalog(){
 let q=$('catalogSearch').value.trim().toLowerCase(),cat=$('catalogCategory').value,status=$('catalogStatus').value;
 let list=products.filter(p=>(cat==='全部'||p.category===cat)&&(status==='全部'||p.status===status)&&(!q||p.name.toLowerCase().includes(q))).sort((a,b)=>(a.status==='common'?0:1)-(b.status==='common'?0:1)||a.name.localeCompare(b.name,'zh-CN'));
 $('catalogList').innerHTML=list.length?list.map(p=>{let days=p.lastStocked?Math.max(0,Math.floor((parseDate(dateStr(new Date()))-parseDate(p.lastStocked))/86400000)):null;return `<div class="product"><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.category)} · 默认 ${esc(p.qty??1)}${esc(p.unit||'')} · ${p.lastStocked?'上次上货 '+esc(p.lastStocked):'未记录上货日期'}${p.status==='rare'?' · '+(days===null?'未记录上货':days+'天未上货'):''}</div></div><span class="tag ${p.status}">${p.status==='common'?'常用':'不常用'}</span><div class="itemactions"><button class="mini" data-stock="${p.id}">已上货</button><button class="mini" data-edit="${p.id}">编辑</button><button class="mini" data-toggle="${p.id}">${p.status==='common'?'设不常用':'设常用'}</button></div></div>`}).join(''):'<div class="empty">还没有符合条件的商品</div>';
 $('catalogList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
 $('catalogList').querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.stock);p.lastStocked=dateStr(new Date());saveProducts();renderCatalog();toast('上货日期已更新')});
 $('catalogList').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.toggle);p.status=p.status==='common'?'rare':'common';saveProducts();renderCatalog()});
}
function renderHistory(){
 let dates=Object.keys(orders).sort((a,b)=>b.localeCompare(a));
 $('historyList').innerHTML=dates.length?dates.map(d=>{let o=orders[d]||{},count=Object.keys(o).length;return `<div class="historyrow"><div><b style="font-size:14px">${dayLabel(d)}</b><div class="hint" style="margin-top:4px">${count} 种商品</div></div><button class="btn outline" data-open-date="${d}">查看 / 修改</button></div>`}).join(''):'<div class="empty">还没有历史记录。<br>填写并选择商品后，这里会自动留下记录。</div>';
 $('historyList').querySelectorAll('[data-open-date]').forEach(b=>b.onclick=()=>{setDate(b.dataset.openDate);changePage('order')});
}
function openModal(p=null){$('productForm').reset();$('productId').value=p?.id||'';$('modalTitle').textContent=p?'编辑商品':'新增商品';$('productName').value=p?.name||'';$('productCategory').value=p?.category||'面包';$('productQty').value=p?.qty??1;$('productUnit').value=p?.unit||'';$('productStatus').value=p?.status||'common';$('productStocked').value=p?.lastStocked||'';$('modalBack').classList.add('show')}
function closeModal(){$('modalBack').classList.remove('show')}
function editProduct(id){let p=products.find(x=>x.id===id);if(p)openModal(p)}

function exportBackup(){
 const data={
  app:'每日要货助手',
  version:1,
  exportedAt:new Date().toISOString(),
  products,
  orders,
  categories
 };
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='每日要货助手备份_'+dateStr(new Date())+'.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast('备份文件已导出');
}
function importBackup(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(String(reader.result||''));
   if(!data||!Array.isArray(data.products)||!data.orders||typeof data.orders!=='object'||Array.isArray(data.orders)){
    throw new Error('备份文件格式不正确');
   }
   if(!Array.isArray(data.categories))data.categories=[];
   if(!confirm('导入备份会覆盖当前设备里的商品、分类和全部要货记录。建议先导出当前数据备份。确定继续吗？'))return;
   const nextCategories=[...new Set([...DEFAULT_CATEGORIES,...data.categories.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim())])];
   data.products.forEach(p=>{if(p&&p.category&&!nextCategories.includes(p.category))nextCategories.push(p.category)});
   localStorage.setItem(PRODUCT_KEY,JSON.stringify(data.products));
   localStorage.setItem(ORDER_KEY,JSON.stringify(data.orders));
   localStorage.setItem(CATEGORY_KEY,JSON.stringify(nextCategories.filter(c=>!DEFAULT_CATEGORIES.includes(c))));
   products=data.products;orders=data.orders;categories=nextCategories;
   renderCategoryControls();
   setDate(activeDate||shift(dateStr(new Date()),1));
   renderCatalog();renderHistory();
   toast('数据恢复成功');
  }catch(err){
   alert('导入失败：'+(err.message||'文件无法读取'));
  }finally{
   $('restoreFile').value='';
  }
 };
 reader.onerror=()=>{alert('读取备份文件失败');$('restoreFile').value=''};
 reader.readAsText(file,'UTF-8');
}

$('productForm').onsubmit=e=>{e.preventDefault();let id=$('productId').value,data={name:$('productName').value.trim(),category:$('productCategory').value,qty:Math.max(0,Number($('productQty').value)||0),unit:$('productUnit').value.trim(),status:$('productStatus').value,lastStocked:$('productStocked').value||null};if(!data.name)return;
 // Prevent duplicate product names across the entire catalog. Ignore spaces and letter case.
 const normalizeName=value=>String(value||'').replace(/\\s+/g,'').toLocaleLowerCase();
 const duplicate=products.find(p=>normalizeName(p.name)===normalizeName(data.name)&&p.id!==id);
 if(duplicate){
   const goEdit=confirm(`商品「${duplicate.name}」已经存在（分类：${duplicate.category}）。\\n\\n不再重复新增。是否直接打开已有商品进行修改？`);
   if(goEdit){closeModal();openModal(duplicate);}
   return;
 }
 if(id)Object.assign(products.find(p=>p.id===id),data);else products.push({id:uid(),...data});saveProducts();closeModal();renderOrder();renderCatalog();toast(id?'商品已更新':'商品已添加')};
$('backupBtn').onclick=()=>{const action=prompt('数据备份：\n输入 1：导出备份\n输入 2：导入恢复','1');if(action==='1')exportBackup();else if(action==='2')$('restoreFile').click()};$('restoreFile').onchange=()=>importBackup($('restoreFile').files[0]);$('addProductBtn').onclick=()=>openModal();$('newProduct').onclick=()=>openModal();$('manageCategories').onclick=addCategory;$('cancelModal').onclick=closeModal();$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>changePage(b.dataset.page));

$('orderDate').onchange=()=>setDate($('orderDate').value||dateStr(new Date()));
$('prevDay').onclick=()=>setDate(shift(activeDate,-1));$('nextDay').onclick=()=>setDate(shift(activeDate,1));$('todayBtn').onclick=()=>setDate(shift(dateStr(new Date()),1));
$('clearOrder').onclick=()=>{if(!confirm('确定清空这一天的要货单吗？历史其他日期不会受影响。'))return;orders[activeDate]={};saveOrders();renderOrder();toast('当天清单已清空')};
$('copyOrder').onclick=async()=>{let o=currentOrder(),lines=['要货日期：'+dayLabel(activeDate)];let cats=categories;cats.forEach(c=>{let entries=Object.entries(o).map(([id,v])=>({p:products.find(p=>p.id===id),v})).filter(x=>x.p&&x.p.category===c);if(entries.length){lines.push('\n【'+c+'】');entries.forEach(x=>lines.push(`${x.p.name} ${x.v.qty}${x.v.unit||''}`))}});if(!Object.keys(o).length){toast('先选择需要的商品');return}try{await navigator.clipboard.writeText(lines.join('\n'));toast('要货单已复制，可以发给后厨了')}catch(e){let t=document.createElement('textarea');t.value=lines.join('\n');document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('要货单已复制')}};
load();renderCategoryControls();let tomorrow=shift(dateStr(new Date()),1);setDate(tomorrow);
